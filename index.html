*{box-sizing:border-box;margin:0;padding:0}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.card{background:#111;border:1px solid #1a1a1a;border-radius:16px;padding:16px}
.inp{width:100%;background:#151515;border:1px solid #222;border-radius:10px;padding:12px;color:#fff;font-size:14px}
.btn{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600}.btn-primary{background:#fff;color:#000}.btn-outline{background:#111;border:1px solid #222;color:#fff}.btn-small{padding:6px 10px;font-size:11px;border-radius:8px}
.topbar{position:sticky;top:0;z-index:9000;background:#050505;border-bottom:1px solid #111;display:flex;align-items:center;gap:12px;padding:12px 16px}
.hamburger{width:40px;height:40px;border-radius:10px;background:#111;border:1px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}.hamburger span{width:18px;height:2px;background:#fff;border-radius:2px;display:block}
.brand-mini{flex:1;display:flex;flex-direction:column;align-items:center}.brand-mini .btitle{font-size:15px;font-weight:900;letter-spacing:3px;color:#fff}.brand-mini .vlabel{font-size:8px;color:#ff0000;letter-spacing:2px;margin-top:2px}
.dragon-mini{width:32px;height:32px;filter:drop-shadow(0 0 8px rgba(255,0,0,0.5));border-radius:6px}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9989;opacity:0;pointer-events:none;transition:opacity 0.3s}.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:85%;max-width:320px;background:#0a0a0a;z-index:9990;transform:translateX(-100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;border-right:1px solid #1f0000;overflow-y:auto}.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px 16px 8px;border-bottom:1px solid #151515}.dojo-os-title{display:flex;align-items:center;gap:10px}.dojo-os-icon{width:36px;height:36px;background:linear-gradient(135deg,#ff0000,#8B0000);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}

  let h='';for(let t of S.todos){h+=`<div class="todo-item"><div class="todo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')"></div><div class="todo-text ${t.done?'done':''}" onclick="toggleTodo('${t.id}')">${t.text}</div><div class="todo-del" onclick="deleteTodo('${t.id}')">✕</div></div>`;}
  el.innerHTML=h;
}
function toggleTodo(id){const t=S.todos.find(x=>x.id===id);if(t){t.done=!t.done;save();renderTodos();}}
function deleteTodo(id){if(confirm('¿Borrar tarea?')){S.todos=S.todos.filter(x=>x.id!==id);save();renderTodos();}}
function addTodo(){const inp=document.getElementById('todoInput');if(!inp||!inp.value.trim()) return;S.todos.push({id:Date.now().toString(),text:inp.value.trim(),done:false});inp.value='';save();renderTodos();}

    c.innerHTML=h;

<script>
(function(){
  const CORRECT_PIN="1323";const STORAGE_KEY="bl_pin_auth_v31";let entered="";const lock=document.getElementById('pinLockScreen');const dots=document.querySelectorAll('.pin-dot');const err=document.getElementById('pinError');
  function isAuth(){return sessionStorage.getItem(STORAGE_KEY)==="1";}function setAuth(){sessionStorage.setItem(STORAGE_KEY,"1");lock.classList.add('hidden');}function clearAuth(){sessionStorage.removeItem(STORAGE_KEY);entered="";updateDots();lock.classList.remove('hidden');}
  window.blLock=clearAuth;function updateDots(){dots.forEach((d,i)=>{d.classList.toggle('filled',i<entered.length);});}
  function shake(){lock.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:300});}
  if(isAuth()){lock.classList.add('hidden');}
  document.getElementById('pinKeypad').addEventListener('click',(e)=>{const key=e.target.closest('.pin-key');if(!key||key.classList.contains('empty')) return;if(key.id==='pinDel'){entered=entered.slice(0,-1);err.textContent="";updateDots();return;}const k=key.dataset.k;if(!k) return;if(entered.length>=4) return;entered+=k;updateDots();if(entered.length===4){if(entered===CORRECT_PIN){err.textContent="";setTimeout(setAuth,150);}else{err.textContent="PIN INCORRECTO";shake();setTimeout(()=>{entered="";updateDots();err.textContent="";},800);}}});
})();
</script>

<script>
(function(){
  function nuke(){
    try{
      document.querySelectorAll('div, footer, section').forEach(function(el){
        const t=(el.innerText||'').toLowerCase();
        if((t.includes('tiiny') && t.length<300) || t.includes('upload for free') || (t.includes('shared with') && t.includes('host'))){
          if(el.id!=='app' && !el.classList.contains('drawer') && !el.classList.contains('card')){
            const s=window.getComputedStyle(el);
            if(s.position==='fixed'){ el.remove(); }
          }
        }
      });
      const last=document.body.lastElementChild;
      if(last){
        const lt=(last.innerText||'').toLowerCase();
        if(lt.includes('tiiny') || lt.includes('upload for free')){
          if(last.id!=='app') last.remove();
        }
      }
    }catch(e){}
  }
  setInterval(nuke, 80);
  document.addEventListener('DOMContentLoaded', nuke);
  window.addEventListener('load', nuke);
  try{ new MutationObserver(nuke).observe(document.body,{childList:true, subtree:true}); }catch(e){}
})();
</script>
